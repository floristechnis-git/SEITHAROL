name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ensure Keystore and Config
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"0","project_id":"seitharol","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"in.floristechnis.seitharol"}}}]}' > app/google-services.json
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK for Upload
      run: |
        APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
        echo "Built APK: $APK_PATH"
        if [ "$APK_PATH" != "app/build/outputs/apk/debug/in.floristechnis.seitharol-v3.2.4.apk" ]; then
          cp "$APK_PATH" app/build/outputs/apk/debug/in.floristechnis.seitharol-v3.2.4.apk
        fi
        ls -la app/build/outputs/apk/debug/

    - name: Delete Old Artifacts (>2 days)
      uses: actions/github-script@v7
      with:
        script: |
          const twoDaysAgo = new Date(Date.now() - 2 * 24 * 60 * 60 * 1000);
          const perPage = 100;
          let page = 1;
          let deleted = 0;

          while (true) {
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: perPage,
              page,
            });

            if (data.artifacts.length === 0) break;

            for (const artifact of data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < twoDaysAgo) {
                console.log(`Deleting artifact: ${artifact.name} (created ${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted++;
              }
            }

            if (data.artifacts.length < perPage) break;
            page++;
          }

          console.log(`Done. Deleted ${deleted} artifact(s) older than 2 days.`);

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: in.floristechnis.seitharol-v3.2.4.apk
        path: app/build/outputs/apk/debug/in.floristechnis.seitharol-v3.2.4.apk
        if-no-files-found: error
        overwrite: true
        retention-days: 2
